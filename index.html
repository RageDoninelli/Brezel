<style>
:root{

  --yellow:#FFC400; --yellow-d:#E6AE00; --red:#D93B2F; --green:#1B8A55; --blue:#1D5BBF;

}
:root[data-theme="dark"]{ --ink:#ECEFF1; --paper:#0E1217; --card:#171D25; --mute:#9AA6B2; --line:#46515E; --soft:#232B35; --ok-bg:#123324; --no-bg:#3A1A18; --shadow:0 2px 0 #000; --blue:#6EA3FF; --green:#4BC98A; --red:#FF7468; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}

p{margin:.5em 0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--yellow);color:#12171E;padding:8px 12px;z-index:99}.skip:focus{left:8px;top:8px}
main{max-width:640px;margin:0 auto;padding:14px 16px 24px;outline:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));max-width:640px;margin:0 auto}

.flag{display:flex;height:6px;max-width:100%}.flag i{flex:1}.flag i:nth-child(1){background:#111}.flag i:nth-child(2){background:#DD0000}.flag i:nth-child(3){background:#FFCE00}
#install{display:flex;align-items:center;gap:10px;background:var(--yellow);color:#12171E;padding:8px 12px;font-size:.9rem}#install[hidden]{display:none}#install span{flex:1}
/* botones */
.btn{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 18px;font-weight:700;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}

.btn.bigplay{background:var(--ink);color:var(--paper);min-height:54px;font-size:1.05rem}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;flex:none}
.actions{display:flex;gap:10px;margin:18px 0 6px}.actions .btn{flex:1}.actions.row .btn{flex:1}

.card.center{text-align:center}

.tabbar svg{width:24px;height:24px;fill:currentColor}
.tabbar a.on{color:var(--ink)}.tabbar a.on::before{content:"";position:absolute;top:-2px;left:22%;right:22%;height:4px;background:var(--yellow);border-radius:0 0 4px 4px}
.tabbar em{position:absolute;top:4px;left:calc(50% + 8px);background:var(--red);color:#fff;font:700 .68rem var(--head);border-radius:99px;padding:0 6px;min-width:18px;text-align:center;font-style:normal}

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;border:1.5px solid var(--line)}.bar i{display:block;height:100%;background:var(--yellow)}

.duecard b{font:700 1.6rem var(--head);color:var(--red)}.duecard span{flex:1}.duecard em{font:700 .9rem var(--head);font-style:normal;border:2px solid var(--red);color:var(--red);border-radius:99px;padding:3px 12px}
.seg{display:flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:14px 0;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:9px;font:700 1rem var(--head)}.seg [aria-selected=true]{background:var(--ink);color:var(--paper)}
.line{position:relative}
.mod{margin:0 0 22px}
.modh{display:flex;align-items:center;gap:12px;margin-bottom:8px}

.lv-B1 .badge{background:#12171E;color:var(--yellow);border-color:#12171E}
:root[data-theme="dark"] .lv-B1 .badge{background:#ECEFF1;color:#12171E}
.stations{list-style:none;margin:0;padding:0 0 0 18px;position:relative}
.stations::before{content:"";position:absolute;left:36px;top:18px;bottom:30px;width:5px;background:var(--ink);border-radius:3px;opacity:.9}
.stations li{position:relative;margin:0 0 8px}
.stations a{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:9px 12px 9px 9px;position:relative;z-index:1}
.stations .lt{flex:1;display:flex;flex-direction:column;min-width:0}.stations .lt b{font-weight:700;line-height:1.25}.stations .lt small{color:var(--mute);line-height:1.25}
.stations .lp{font:700 .95rem var(--head);color:var(--mute)}
.stations .done .plat{background:var(--green);border-color:var(--green)}.stations .done .lp{color:var(--green);font-size:1.2rem}
.stations .cur a{background:var(--yellow);color:#12171E;border-color:#12171E;box-shadow:0 3px 0 #12171E}.stations .cur .lt small,.stations .cur .lp{color:#12171E;opacity:.8}
.stations .testrow .plat{background:transparent;color:var(--ink);border-style:dashed;border-color:var(--ink)}
.stations .testrow a{border-style:dashed}
/* lección */
.lhead{display:flex;gap:12px;align-items:flex-start;margin:4px 0 12px}.lhead .lvl{font:700 .85rem var(--head);color:var(--mute)}.lhead .sub{color:var(--mute)}
.lhead .back{margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font:700 .95rem var(--head)}

.goals ul,.plain{margin:8px 0 0;padding-left:20px}.goals li,.plain li{margin:3px 0}
.gram h2{margin-bottom:6px}.gp{line-height:1.6}
.gp .de,.de-i{font-weight:700}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1.5px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
thead th{background:var(--ink);color:var(--paper);font-family:var(--head)}tbody th{background:var(--soft);font-weight:700}
.exs{list-style:none;margin:12px 0 0;padding:0}
.exs li{position:relative;padding:8px 46px 8px 12px;border-left:5px solid var(--yellow);margin:8px 0;background:var(--soft);border-radius:0 8px 8px 0}

.say{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:1.25rem;padding:6px;border-radius:50%;line-height:1}

.tools{display:flex;align-items:center;gap:12px;justify-content:space-between}.tools div{display:flex;flex-direction:column}.tools small{color:var(--mute)}
.vlist,.plist{list-style:none;margin:0;padding:0}
.vlist li{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0}
.vtop{display:flex;justify-content:space-between;align-items:center}.vlist .say,.plist .say{position:static;transform:none}
.vde{font:700 1.25rem var(--head)}.pl{margin-left:8px;color:var(--mute);font:400 .8rem var(--body)}

.plist li{position:relative;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0}
.pdet{flex:1;min-width:0}.use{font:700 .82rem var(--head);color:var(--mute)}.pde{font:700 1.08rem/1.3 var(--head)}.pes{color:var(--mute);font-size:.92rem}
.pbtns{display:flex;gap:4px}.mic{border:0;background:transparent;font-size:1.25rem;padding:6px;border-radius:50%}.mic.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.said{display:none;flex-basis:100%;font-size:.92rem;padding:6px 10px;border-radius:8px;background:var(--soft)}.said.on{display:block}.said.ok{background:var(--ok-bg)}.said.mid{background:#FFF1C9;color:#12171E}.said.no{background:var(--no-bg)}

.dtools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.dlg{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.bub{display:flex;gap:8px;align-items:center;max-width:92%;padding:9px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card);transition:background .2s}
.bub.A{align-self:flex-start;border-bottom-left-radius:3px}.bub.B{align-self:flex-end;flex-direction:row-reverse;border-bottom-right-radius:3px;background:var(--soft)}
.bub .who{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .85rem var(--head);display:flex;align-items:center;justify-content:center}
.bub .bt{flex:1}.bub .say{position:static;transform:none}
.bub .bes{display:none;color:var(--mute);font-size:.88rem}.showtr .bes{display:block}
.bub.hl{background:var(--yellow);color:#12171E}.bub.hl .bes{color:#12171E}

.rp{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);border-radius:var(--r);padding:12px;margin-top:10px}
.rp .rpt{font:700 .85rem var(--head);color:var(--yellow)}.rp .rph{font-size:1.05rem;margin:2px 0 10px}.rpb{display:flex;gap:8px;flex-wrap:wrap}
.rp .btn{background:var(--card);color:var(--ink)}.rp .btn.primary{background:var(--yellow);color:#12171E}.rp .said{color:var(--ink)}
/* ejercicios */
.exbar{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.prog{flex:1;height:12px;background:var(--soft);border:2px solid var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--yellow);transition:width .25s}
.count{font:700 .9rem var(--head);color:var(--mute)}.ph{font-size:1.2rem}
.qlabel{font:700 .85rem var(--head);color:var(--mute);margin-bottom:8px}
.exq.retry{border-style:dashed}
.q{font:600 1.2rem/1.5 var(--body);margin:.2em 0 .8em}.q.es{font-size:1.1rem}.q.shd{font:700 1.4rem/1.35 var(--head)}

.opt.sel{background:var(--yellow);color:#12171E;border-color:#12171E}.opt.right{background:var(--ok-bg);border-color:var(--green)}.opt.wrong{background:var(--no-bg);border-color:var(--red)}

.ans{width:100%;border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--paper);color:var(--ink);font:1.1rem var(--body)}
textarea.ans{resize:vertical}
.gapin{width:auto;display:inline-block;padding:4px 8px;margin:0 4px;vertical-align:baseline;text-align:center;font-weight:700;border-width:0 0 3px;border-radius:4px 4px 0 0;background:var(--soft)}
.ans.right{background:var(--ok-bg);border-color:var(--green)}.ans.wrong{background:var(--no-bg);border-color:var(--red)}
.uml{display:flex;gap:6px;margin:8px 0 0}.uk{border:2px solid var(--line);background:var(--card);border-radius:8px;min-width:40px;height:40px;font:700 1.1rem var(--body)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:grid;gap:8px;align-content:start}

.corr{font-weight:700;margin-top:4px}.why{margin-top:4px;font-size:.95rem}.listen{margin-top:8px;border:0;background:transparent;font-weight:700;text-decoration:underline;padding:4px 0}

.dbtns{display:flex;gap:10px;margin:8px 0 14px}.dbtns .btn{flex:1}
.result{text-align:center}.bigpct{font:700 4rem/1 var(--head)}.bigpct.good{color:var(--green)}.bigpct.low{color:var(--red)}.xp{font:700 1.1rem var(--head);color:var(--mute)}
.missed{text-align:left;margin-top:10px;background:var(--soft);border-radius:var(--r);padding:10px 14px}.missed ul{margin:6px 0 0;padding-left:18px}

.plainlist{display:grid;gap:8px}.rowlink{display:flex;flex-direction:column;border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px;text-decoration:none}.rowlink small{color:var(--mute)}
